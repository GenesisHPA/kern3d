name: Release desktop apps

# Push a tag like v0.8.1 (equal to package.json "version"): Windows and Linux are built,
# then one GitHub release is published with the installers and the update feeds
# (latest.yml / latest-linux.yml) the installed apps check.

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing tag to (re)build, e.g. v0.8.1"
                required: true

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: true
            matrix:
                include:
                    - os: windows-latest
                      target: --win
                    - os: ubuntu-latest
                      target: --linux
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Check that the tag matches package.json
              shell: bash
              run: |
                  TAG="${{ inputs.tag || github.ref_name }}"
                  VERSION="v$(node -p "require('./package.json').version")"
                  [ "$TAG" = "$VERSION" ] || { echo "tag $TAG != package.json $VERSION"; exit 1; }

            - name: Build web app
              run: |
                  npm ci
                  npm run build

            - name: Build installer
              working-directory: desktop
              run: |
                  npm ci
                  npm run prepare-app
                  npx electron-builder ${{ matrix.target }} --publish never

            - uses: actions/upload-artifact@v4
              with:
                  name: dist-${{ matrix.os }}
                  if-no-files-found: error
                  path: |
                      desktop/release/*.exe
                      desktop/release/*.AppImage
                      desktop/release/*.blockmap
                      desktop/release/latest*.yml

    release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - uses: actions/download-artifact@v4
              with:
                  path: out
                  merge-multiple: true

            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${{ inputs.tag || github.ref_name }}"
                  # notes: this version's section of CHANGELOG.md, then how to install
                  NOTES="$RUNNER_TEMP/notes.md"
                  node scripts/release-notes.mjs "${TAG#v}" > "$NOTES"
                  cat "$NOTES"
                  ls -la out
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" out/* --clobber
                  else
                      gh release create "$TAG" out/* --title "Kern3D ${TAG#v}" --notes-file "$NOTES" --latest
                  fi
